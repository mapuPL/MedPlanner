allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

subprojects { subproject ->
    if (subproject.name != "app") {
        def enforceCompileSdk = { Project p ->
            if (p.plugins.hasPlugin("com.android.library")) {
                def androidExt = p.extensions.findByName("android")
                if (androidExt != null) {
                    try {
                        def currentSdk = androidExt.compileSdk
                        if (currentSdk == null || (currentSdk instanceof Integer && currentSdk < 36)) {
                            androidExt.compileSdk = 36
                        }
                    } catch (Exception ignored) {
                        try {
                            androidExt.compileSdkVersion 36
                        } catch (Exception ignored2) {}
                    }
                }
            }
        }

        if (subproject.state.executed) {
            enforceCompileSdk(subproject)
        } else {
            subproject.afterEvaluate { p -> enforceCompileSdk(p) }
        }
    }
}

subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
