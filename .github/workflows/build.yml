name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Flutter Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod repozytorium (Checkout)
        uses: actions/checkout@v4

      - name: Konfiguracja Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Konfiguracja Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Przygotowanie platformy Android i zgodności JVM
        run: |
          # Jeśli w repozytorium brakuje wrappera Gradle lub settings.gradle.kts, Flutter wygeneruje je automatycznie
          if [ ! -f "android/gradlew" ] || ( [ ! -f "android/settings.gradle.kts" ] && [ ! -f "android/settings.gradle" ] ); then
            echo "Inicjalizacja brakującej otoczki Android..."
            flutter create . --platforms=android --org=com.example --project-name=medplaner
          fi

          # Usuń ewentualne stare pliki Groovy, aby uniknąć konfliktu z Kotlin DSL (.kts)
          rm -f android/build.gradle android/app/build.gradle android/settings.gradle

          # Wymuszenie zgodności wersji JVM oraz bezpiecznego trybu AGP 9+ dla wtyczek Fluttera
          mkdir -p android
          touch android/gradle.properties
          grep -q "kotlin.jvm.target.validation.mode=" android/gradle.properties || echo "kotlin.jvm.target.validation.mode=warning" >> android/gradle.properties
          sed -i '/^android\.builtInKotlin=/d' android/gradle.properties
          sed -i '/^android\.newDsl=/d' android/gradle.properties
          echo "android.builtInKotlin=false" >> android/gradle.properties
          echo "android.newDsl=false" >> android/gradle.properties

          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i "s/compileSdk = [0-9]\+/compileSdk = 36/g" android/app/build.gradle.kts
            sed -i "s/targetSdk = [0-9]\+/targetSdk = 36/g" android/app/build.gradle.kts
          fi

      - name: Pobranie zależności Flutter (pub get)
        run: flutter pub get

      - name: Odczytaj odciski certyfikatów SHA-1 i SHA-256 dla Google Sign-In
        run: |
          echo "================================================================================"
          echo "ODCISKI KLUCZY CERTYFIKATÓW DLA GOOGLE CLOUD CONSOLE (OAUTH CLIENT ID ANDROID):"
          echo "Pakiet aplikacji (Package name): com.example.medplaner"
          echo "================================================================================"
          if [ -d "android" ]; then
            cd android
            echo "--- Raport podpisów Gradle (signingReport) ---"
            ./gradlew signingReport || true
            cd ..
          fi
          if [ -f "$HOME/.android/debug.keystore" ]; then
            echo "--- Domyślny debug.keystore SHA-1: ---"
            keytool -list -v -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android -keypass android | grep -E "SHA1:|SHA256:" || true
          fi
          echo "================================================================================"

      - name: Budowanie pliku APK Release
        run: flutter build apk --release

      - name: Zapisz plik APK jako artefakt
        uses: actions/upload-artifact@v4
        with:
          name: medplaner-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
