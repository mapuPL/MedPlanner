name: medplaner
description: "Aplikacja do zarzadzania terapiami medycznymi i elastycznym dawkowaniem lekow"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  flutter_timezone: ^5.1.1
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  intl: ^0.19.0
  uuid: ^4.5.1
  cupertino_icons: ^1.0.8
  google_sign_in: ^6.2.1
  googleapis: ^13.2.0
  http: ^1.2.2
  file_picker: ^13.4.1
  share_plus: ^13.2.0
  pdf: ^3.11.1
  printing: ^5.13.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo_icon.png
    - assets/fonts/LiberationSans-Regular.ttf
    - assets/fonts/LiberationSans-Bold.ttf
